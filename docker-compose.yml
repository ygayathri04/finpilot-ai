services:
  postgres:
    image: postgres:17
    container_name: finpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot_dev
      POSTGRES_DB: finpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: